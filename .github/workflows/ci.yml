name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -warnaserror
      - run: dotnet test --no-build -c Release --logger "console;verbosity=normal"

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  schema:
    # Applies the SQL twice to a real PostgreSQL to prove the scripts are idempotent.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: angaza
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema and seed twice
        env:
          PGPASSWORD: postgres
        run: |
          for i in 1 2; do
            for f in db/*.sql; do psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d angaza -q -f "$f"; done
          done
          psql -h localhost -U postgres -d angaza -tAc "select count(*) from danger_signs" | grep -qx 10
